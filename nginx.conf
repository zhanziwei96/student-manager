# 班级管理系统 Nginx 配置文件
# 
# 使用方法:
# 1. 修改 server_name 为你的域名或 IP
# 2. 修改 frontend/dist 路径为你的实际路径
# 3. 将配置文件复制到 /etc/nginx/sites-available/
# 4. 创建软链接: ln -s /etc/nginx/sites-available/student-manage /etc/nginx/sites-enabled/
# 5. 测试配置: nginx -t
# 6. 重载配置: nginx -s reload

server {
    listen 80;
    server_name localhost;  # 修改为你的域名或 IP
    
    # 日志配置
    access_log /var/log/nginx/student-manage-access.log;
    error_log /var/log/nginx/student-manage-error.log;
    
    # 前端静态文件
    location / {
        root /path/to/student-manage/frontend/dist;  # 修改为实际路径
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # API 请求转发到 Flask
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        # 设置请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 支持 WebSocket（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    
    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

