# 班级管理系统 Nginx 配置文件
# 
# 使用方法:
# 1. 将配置文件复制到 /etc/nginx/sites-available/
# 2. 创建软链接: ln -s /etc/nginx/sites-available/student-manage /etc/nginx/sites-enabled/
# 3. 测试配置: nginx -t
# 4. 重载配置: nginx -s reload

# HTTP 重定向到 HTTPS
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS 配置
server {
    listen 443 ssl default_server;
    server_name _;
    
    # SSL 证书配置（使用自签名证书）
    ssl_certificate /etc/nginx/ssl/student-manage.crt;
    ssl_certificate_key /etc/nginx/ssl/student-manage.key;
    
    # SSL 安全设置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # 日志配置
    access_log /var/log/nginx/student-manage-access.log;
    error_log /var/log/nginx/student-manage-error.log;
    
    # 前端静态文件路径（需要 www-data 可访问）
    root /var/www/student-manage;
    index index.html;
    
    # Gzip 压缩 - 大幅提高传输效率
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/xml 
        application/rss+xml 
        font/truetype 
        font/opentype 
        application/vnd.ms-fontobject 
        image/svg+xml;
    
    # 静态资源缓存 - 1年（因为文件名有 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # API 请求转发到 Flask
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # API 响应不缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }
    
    # 前端路由 - 支持 Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
