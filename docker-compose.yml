services:
  postgres:
    image: postgres:15-alpine
    container_name: classhub-postgres
    environment:
      POSTGRES_USER: classhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classhub_secret}
      POSTGRES_DB: classhub
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups/postgres:/backups
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - classhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classhub -d classhub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classhub-backend
    expose:
      - "8000"
    env_file:
      - backend/.env.production
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
      - ${BACKUPS_DIR:-./backups}:/app/backups
      - ${LOGS_DIR:-./backend/logs}:/app/logs
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE__URL=postgresql+psycopg2://classhub:${POSTGRES_PASSWORD:-classhub_secret}@postgres:5432/classhub
      - BACKUP__DIR=/app/backups
      - APP__HOST=0.0.0.0
      - APP__PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 256M
    networks:
      - classhub-network

  nginx:
    image: nginx:alpine
    container_name: classhub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONFIG:-./docker/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${SSL_CERTS_DIR:-./docker/certs}:/etc/nginx/certs:ro
      - ${FRONTEND_DIST:-./frontend-v3/dist}:/var/www/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - classhub-network

  pg_backup:
    image: postgres:15-alpine
    container_name: classhub-pg-backup
    environment:
      POSTGRES_USER: classhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classhub_secret}
      PGPASSWORD: ${POSTGRES_PASSWORD:-classhub_secret}
      POSTGRES_DB: classhub
      PGHOST: postgres
    volumes:
      - ./backups/postgres:/backups
      - ./docker/postgres/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "echo '0 2 * * * /bin/sh /backup.sh' | crontab - && crond -f -l 2"]
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - classhub-network

volumes:
  postgres_data:

networks:
  classhub-network:
    driver: bridge
