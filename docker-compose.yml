version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classhub-backend
    # 不暴露端口，只通过内部网络访问
    expose:
      - "8000"
    volumes:
      # 数据目录挂载（使用相对路径或环境变量）
      - ${DATA_DIR:-./backend/data}:/app/data
      # 上传文件目录挂载
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
      # 备份目录挂载
      - ${BACKUPS_DIR:-./backups}:/app/backups
      # 日志目录挂载
      - ${LOGS_DIR:-./backend/logs}:/app/logs
    environment:
      - ENV=production
      - DEBUG=false
      # 使用双下划线格式
      - DATABASE__PATH=/app/data/class_system.db
      - BACKUP__DIR=/app/backups
      - SECURITY__SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - APP__HOST=0.0.0.0
      - APP__PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - classhub-network

  nginx:
    image: nginx:alpine
    container_name: classhub-nginx
    ports:
      - "80:80"       # HTTP - 自动跳转 HTTPS
      - "443:443"     # HTTPS
    volumes:
      # Nginx 配置文件（使用相对路径或环境变量）
      - ${NGINX_CONFIG:-./docker/nginx.conf}:/etc/nginx/nginx.conf:ro
      # SSL 证书
      - ${SSL_CERTS_DIR:-./docker/certs}:/etc/nginx/certs:ro
      # 前端静态文件
      - ${FRONTEND_DIST:-./frontend-v3/dist}:/var/www/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - classhub-network

networks:
  classhub-network:
    driver: bridge
