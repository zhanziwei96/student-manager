[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 8 分库并行（classhub_test_0..7 + classhub_migration_test_0..7 需存在，见 tests/README.md）
# 实测：-n 8 ≈ -n 12（约 82s）；-n 16 反而退化到 180s（CPU 饱和）
addopts = -v --tb=short -n 8
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    smoke: 冒烟测试（核心业务流程）
    integration: 集成测试
    unit: 单元测试
