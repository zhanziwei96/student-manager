<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="ClassHub - Smart Student Management System" />
    <title>ClassHub</title>

    <!-- 高德地图 JavaScript API -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=ef9c57844e2b4ab9f0838d88099a4b5b&plugin=AMap.Geocoder,AMap.Marker,AMap.ToolBar"></script>
    <script>
      // 高德地图安全密钥配置（需要在控制台配置）
      window._AMapSecurityConfig = {
        securityJsCode: '', // 如需安全密钥，在此配置
      }
    </script>

    <style>
      /* Critical CSS to prevent flash */
      html {
        background-color: #ffffff;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background-color: #ffffff;
        color: #000000;
        /* 适配刘海屏安全区域 */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* 防止 iOS 自动缩放 */
      input, select, textarea {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
