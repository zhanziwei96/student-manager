<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="ClassHub - Smart Student Management System" />
    <title>ClassHub</title>
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    
    <!-- 高德地图 JavaScript API -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=ef9c57844e2b4ab9f0838d88099a4b5b&plugin=AMap.Geocoder,AMap.Marker,AMap.ToolBar"></script>
    <script>
      // 高德地图安全密钥配置（需要在控制台配置）
      window._AMapSecurityConfig = {
        securityJsCode: '', // 如需安全密钥，在此配置
      }
    </script>
    
    <style>
      /* Critical CSS to prevent flash */
      html {
        background-color: #030307;
      }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #030307;
        color: #ffffff;
        /* 适配刘海屏安全区域 */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* 防止 iOS 自动缩放 */
      input, select, textarea {
        font-size: 16px;
      }
      /* CACHE TEST - 红色边框表示获取到了最新版本 */
      body { border: 5px solid red !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
