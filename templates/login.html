{% extends "base.html" %}

{% block title %}老师登录 - 班级管理系统{% endblock %}

{% block extra_css %}
<style>
.login-container {
    max-width: 400px;
    margin: 2rem auto;
}

.login-card {
    background: white;
    padding: 2.5rem;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(102, 126, 234, 0.15);
}

.login-header {
    text-align: center;
    margin-bottom: 2rem;
}

.login-header h2 {
    color: #333;
    margin-bottom: 0.5rem;
    border-bottom: none;
}

.login-header p {
    color: #666;
}

.login-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 2.5rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: #555;
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 0.875rem 1rem;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 1rem;
    transition: all 0.3s;
}

.form-group input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.login-btn {
    width: 100%;
    padding: 1rem;
    font-size: 1.1rem;
    border-radius: 8px;
    margin-top: 1rem;
}

.login-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid white;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.alert {
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
}

.alert.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}

.alert.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.login-info {
    margin-top: 2rem;
    padding: 1.5rem;
    background: #f8f9fa;
    border-radius: 8px;
}

.login-info h4 {
    margin-bottom: 1rem;
    color: #333;
}

.login-info ul {
    margin-left: 1.5rem;
    color: #666;
    line-height: 1.8;
}

.login-info code {
    background: #e9ecef;
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    font-family: monospace;
}
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">👨‍🏫</div>
            <h2>老师登录</h2>
            <p>请使用管理员账户登录</p>
        </div>
        
        <div id="alert-container"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" required placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" required placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="login-btn">
                <span class="btn-text">登 录</span>
            </button>
        </form>
    </div>
    
    <div class="login-info">
        <h4>💡 默认账户信息</h4>
        <ul>
            <li>用户名: <code>admin</code></li>
            <li>密码: <code>admin123</code></li>
            <li>首次登录后建议修改密码</li>
        </ul>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 显示提示
function showAlert(message, type = 'success') {
    const container = document.getElementById('alert-container');
    const alert = document.createElement('div');
    alert.className = `alert ${type}`;
    alert.textContent = message;
    container.innerHTML = '';
    container.appendChild(alert);
}

// 登录表单提交
document.getElementById('login-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const loginBtn = document.getElementById('login-btn');
    const btnText = loginBtn.querySelector('.btn-text');
    
    if (!username || !password) {
        showAlert('请输入用户名和密码', 'error');
        return;
    }
    
    // 显示加载状态
    loginBtn.disabled = true;
    btnText.innerHTML = '<span class="spinner"></span> 登录中...';
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
            showAlert('登录成功，正在跳转...', 'success');
            // 延迟跳转，让用户看到成功提示
            setTimeout(() => {
                window.location.href = '/admin';
            }, 500);
        } else {
            showAlert(result.message, 'error');
            loginBtn.disabled = false;
            btnText.textContent = '登 录';
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    } catch (error) {
        showAlert('登录失败，请检查网络连接', 'error');
        loginBtn.disabled = false;
        btnText.textContent = '登 录';
    }
});

// 页面加载时聚焦到用户名输入框
window.onload = function() {
    document.getElementById('username')?.focus();
};
</script>
{% endblock %}
